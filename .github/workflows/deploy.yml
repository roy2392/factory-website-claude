name: Deploy to GitHub Pages

# Builds the Vite site and publishes dist/ to the gh-pages branch. This path
# only needs `contents: write` (always available to the workflow token), so it
# avoids the Pages "enablement" API that can fail on a fresh repo.
on:
  push:
    branches:
      - main
      - claude/3d-logistics-platform-nKIqa
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          enable_jekyll: false
          force_orphan: true
