name: Deploy to GitHub Pages

# Official GitHub Pages deployment. `configure-pages` with enablement:true turns
# Pages on via the workflow token, so the site goes live with no manual repo
# settings change. Runs on the feature branch, main, and on-demand.
on:
  push:
    branches:
      - main
      - claude/3d-logistics-platform-nKIqa
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      # Retry once to absorb a transient registry/network blip on a cold runner.
      - run: npm ci || (sleep 5 && npm ci)
      - run: npm run build
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
